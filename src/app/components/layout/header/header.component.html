<mat-toolbar color="primary">
    <span>Todo App</span>
    <span class="spacer"></span>
  
    <ng-container *ngIf="(currentUser$ | async) as user; else loginButtons">
      <span class="user-email">{{ user.email }}</span>
      <button mat-icon-button color="accent" (click)="logout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </ng-container>
  
    <ng-template #loginButtons>
        <div class="auth-buttons">
          <button mat-stroked-button color="accent" class="clickable-button" routerLink="/login" [disabled]="router.url === '/login'">
            <mat-icon class="button-icon">login</mat-icon>
            <span>Login</span>
          </button>
          <button mat-raised-button color="accent" class="clickable-button" routerLink="/register" [disabled]="router.url === '/register'">
            <mat-icon class="button-icon">person_add</mat-icon>
            <span>Register</span>
          </button>
        </div>
      </ng-template>      
  </mat-toolbar>
