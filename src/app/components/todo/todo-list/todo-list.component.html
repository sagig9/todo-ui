<div class="todo-container"  *ngIf="tasks$ | async as tasks">
    <div class="todo-header">
        <h1>My Tasks</h1>
        <button mat-raised-button color="primary" (click)="openTaskForm()">
            <mat-icon>add</mat-icon>
            Add Task
        </button>
    </div>

    <div class="filters">
        <mat-form-field appearance="outline">
            <mat-label>Search tasks</mat-label>
            <input matInput [(ngModel)]="filterValue" (input)="onFilterChange()" placeholder="Search...">
            <button *ngIf="filterValue" matSuffix mat-icon-button aria-label="Clear"
                (click)="filterValue=''; onFilterChange()">
                <mat-icon>close</mat-icon>
            </button>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Priority</mat-label>
            <mat-select [(ngModel)]="priorityFilter" (selectionChange)="onFilterChange()">
                <mat-option value="all">All</mat-option>
                <mat-option value="low">Low</mat-option>
                <mat-option value="medium">Medium</mat-option>
                <mat-option value="high">High</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-slide-toggle [(ngModel)]="showCompleted" (change)="onFilterChange()">
            Show Completed
        </mat-slide-toggle>
    </div>

    <div *ngIf="loading" class="loading-spinner">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="!loading && filteredTasks.length === 0" class="no-tasks">
        <p>No tasks found. Create a new one!</p>
    </div>
    
    <mat-card *ngFor="let task of filteredTasks" class="task-card"
    [ngClass]="{
        'completed': task.completed,
        'priority-high': !task.completed && task.priority === 'high',
        'priority-medium': !task.completed && task.priority === 'medium',
        'priority-low': !task.completed && task.priority === 'low'
      }">
        <mat-card-content>
            <div class="task-header">
                <mat-checkbox [checked]="task.completed" (change)="toggleTaskCompletion(task)" color="primary">
                </mat-checkbox>
                <h3 [class.completed-text]="task.completed">{{ task.title }}</h3>
                <mat-chip-set>
                    <mat-chip [color]="getPriorityColor(task.priority)" [ngClass]="{'selected-chip': task.priority !== 'low'}">
                        {{ task.priority | titlecase }}
                      </mat-chip>
                </mat-chip-set>
            </div>

            <div class="task-details">
                <div class="due-date" *ngIf="task.dueDate">
                    <mat-icon>event</mat-icon>
                    <span [ngClass]="{'overdue': isOverdue(task.dueDate)}">{{ formatDueDate(task.dueDate) }}</span>
                </div>
            </div>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button (click)="openTaskForm(task)" color="primary" [disabled]="task.lockedBy">
                <mat-icon>edit</mat-icon> Edit
            </button>
            <button mat-button (click)="deleteTask(task)" color="warn" [disabled]="task.lockedBy">
                <mat-icon>delete</mat-icon> Delete
            </button>
            <span *ngIf="task.lockedBy" class="lock-indicator">(Locked)</span>
        </mat-card-actions>
    </mat-card>
</div>
